<!doctype html>
<html lang="en" data-theme="dark" data-accent="orange">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11100e" />
    <meta name="description" content="Your private music library and player." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sangeetham" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sangeetham</title>
    <script>
      // Apply the saved theme before React loads, so there is no flash of the wrong colours.
      try {
        var saved = JSON.parse(localStorage.getItem('mp3-player:settings') || 'null');
        var state = saved && saved.state;
        if (state) {
          var theme = state.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : state.theme;
          // Same as the settings store's migration: the old default accent follows the new default.
          var accent = (saved.version || 0) < 2 && state.accent === 'violet' ? 'orange' : state.accent;
          if (theme) document.documentElement.dataset.theme = theme;
          if (accent) document.documentElement.dataset.accent = accent;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
